name: Descargar precios DGEHM

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - requirements.txt
      - .github/workflows/collect.yml
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Descargar y transformar reporte oficial
        run: python collector.py
      - name: Guardar nueva captura
        run: |
          git config user.name "AutoPrice Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/latest.xlsx data/history/
          git diff --cached --quiet || git commit -m "Actualizar precios DGEHM $(date -u +%F)"
          git push
      - name: Adjuntar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-dgehm
          path: |
            diagnostic.html
            diagnostic.png
          if-no-files-found: ignore
