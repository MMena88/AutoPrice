name: Descargar precios DGEHM

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - requirements.txt
      - .github/workflows/collect.yml
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Diagnosticar conexión con DGEHM
        continue-on-error: true
        run: |
          python - <<'PY'
          import socket
          host = "sinapp.dgehm.gob.sv"
          print("DNS:", socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM))
          PY
          curl -kIv --connect-timeout 20 --max-time 35 \
            "https://sinapp.dgehm.gob.sv/drhm/estadisticas.aspx?uid=2"
          curl -kIv --connect-timeout 20 --max-time 35 \
            "https://sinapp.dgehm.gob.sv/hidropublicmovil/preciosruta.aspx?i=25"
      - name: Descargar y transformar reporte oficial
        run: python collector.py
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
      - name: Guardar nueva captura
        run: |
          git config user.name "AutoPrice Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/latest.xlsx data/history/
          git diff --cached --quiet || git commit -m "Actualizar precios DGEHM $(date -u +%F)"
          git push
      - name: Adjuntar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-dgehm
          path: |
            diagnostic.html
            diagnostic.png
          if-no-files-found: ignore
